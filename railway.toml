[build]
builder = "nixpacks"
buildCommand = "yarn install && npx prisma generate --schema=packages/prisma/schema.prisma && npx prisma migrate deploy --schema=packages/prisma/schema.prisma"

[deploy]
startCommand = "yarn workspace @calcom/web dev --hostname 0.0.0.0 --port ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
